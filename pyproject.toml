[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-auto-mailer"
version = "3.1.1"
description = "Ứng dụng gửi email hàng loạt hàng tháng cho nhà cung cấp — Zero-Manual Enterprise (Haesung Vina)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Minh Hai (Haesung Vina)" }
]
dependencies = [
    "openpyxl>=3.1.0",
    "pywebview>=6.0.0",
    "nh3>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["app/domain", "app/adapters", "app/application"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["vendor", "build", "Ban_phat_hanh", ".agents", "installer"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["E501", "S101", "S105", "S106", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["vendor", "build", "Ban_phat_hanh", ".agents"]
